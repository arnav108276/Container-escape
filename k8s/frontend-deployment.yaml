apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-escape-frontend
  labels:
    app: container-escape-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: container-escape-frontend
  template:
    metadata:
      labels:
        app: container-escape-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/example/container-escape-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: container-escape-frontend
spec:
  selector:
    app: container-escape-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
