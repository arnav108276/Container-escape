[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "container-escape-detection"
version = "1.0.0"
description = "Container Escape Detection & Prevention System using eBPF"
requires-python = ">=3.10"

dependencies = [
    "pymongo==4.6.1",
    "pydantic==2.5.0",
    "httpx==0.25.2",
    "python-dotenv==1.0.0",
    "structlog==24.1.0",
    "docker==7.0.0",
    "urllib3==1.26.15"
]

[tool.setuptools]
py-modules = [
    "daemon",
    "event_processor",
    "risk_scorer",
    "container_manager",
    "logger",
]

[tool.uv]
dev-dependencies = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "black==23.12.0",
    "ruff==0.1.8",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
